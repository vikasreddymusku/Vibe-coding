<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-labelledby="t d">
  <title id="t">Vibe Coding: from idea to production with AI</title>
  <desc id="d">Banner showing the path Idea, Prompt, Build, Verify, Ship, drawn as five connected nodes on a dark navy background.</desc>
  <rect width="1200" height="240" fill="#0f172a"/>
  <text x="60" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#f8fafc">Vibe Coding</text>
  <text x="60" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#cbd5e1">From idea to production with AI, verified at every step</text>
  <g stroke="#64748b" stroke-width="3"><line x1="140" y1="190" x2="340" y2="190"/><line x1="340" y1="190" x2="540" y2="190"/><line x1="540" y1="190" x2="740" y2="190"/><line x1="740" y1="190" x2="940" y2="190"/></g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#0f172a" font-weight="600">
    <circle cx="140" cy="190" r="26" fill="#d1fae5" stroke="#059669" stroke-width="3"/><text x="140" y="196">1</text>
    <circle cx="340" cy="190" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="340" y="196">2</text>
    <circle cx="540" cy="190" r="26" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="540" y="196">3</text>
    <circle cx="740" cy="190" r="26" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="740" y="196">4</text>
    <circle cx="940" cy="190" r="26" fill="#cffafe" stroke="#0891b2" stroke-width="3"/><text x="940" y="196">5</text>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#e2e8f0">
    <text x="140" y="232">Idea</text><text x="340" y="232">Prompt</text><text x="540" y="232">Build</text><text x="740" y="232">Verify</text><text x="940" y="232">Ship</text>
  </g>
</svg>
